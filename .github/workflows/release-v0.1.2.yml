name: Publish v0.1.2

on:
  push:
    paths:
      - release-trigger-v0.1.2.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate distribution
        run: npm run check
      - name: Publish v0.1.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.2 >/dev/null 2>&1; then
            echo "Release v0.1.2 already exists."
          else
            gh release create v0.1.2 \
              --target "${GITHUB_SHA}" \
              --title "Glass Tube Display Card v0.1.2" \
              --notes "Fix HACS installation of the multi-file dashboard card by downloading every JavaScript module from dist/."
          fi
      - name: Confirm publication
        run: |
          printf 'Glass Tube Display Card v0.1.2 published successfully.\nSource commit: %s\n' "${GITHUB_SHA}" > RELEASED-v0.1.2.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASED-v0.1.2.txt
          if ! git diff --cached --quiet; then
            git commit -m "Confirm Glass Tube Display Card v0.1.2 release"
            git push
          fi
