name: Publish release

on:
  push:
    paths:
      - release-trigger-v0.3.10.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply v0.3.10 source changes
        run: python3 scripts/apply_v0310_sources.py
      - name: Build self-contained HACS bundle
        run: npm run build
      - name: Validate JavaScript and regression requirements
        run: npm run check
      - name: Commit source and generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            card-core.js \
            tube-renderer.js \
            card-styles.js \
            glass-tube-display-card.js \
            dist/
          if ! git diff --cached --quiet; then
            git commit -m "Build Glass Tube Display Card v0.3.10"
            git push
          fi
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish v0.3.10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.10 >/dev/null 2>&1; then
            echo "Release v0.3.10 already exists."
          else
            gh release create v0.3.10 \
              --target "${TARGET_SHA}" \
              --title "Glass Tube Display Card v0.3.10" \
              --notes "Replaces the interpreted screw artwork with an exact crop from the published Analog Gauge face, including the original recessed ring, metallic highlight, Phillips slot and surrounding black material. Removes rotations and CSS filtering, and restores the Gauge-relative size and corner placement. Existing panel, punctuation rendering, Lovelace API and HACS resource management remain compatible."
          fi
      - name: Record successful publication
        run: |
          printf 'Glass Tube Display Card v0.3.10 published successfully.\nSource commit: %s\n' "${TARGET_SHA}" > RELEASED-v0.3.10.txt
          git add RELEASED-v0.3.10.txt
          if ! git diff --cached --quiet; then
            git commit -m "Confirm Glass Tube Display Card v0.3.10 release"
            git push
          fi
