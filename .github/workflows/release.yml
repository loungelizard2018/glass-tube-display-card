name: Publish release

on:
  push:
    paths:
      - release-trigger-v0.3.8.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply v0.3.8 source changes
        run: python3 scripts/apply_v038_sources.py
      - name: Build self-contained HACS bundle
        run: npm run build
      - name: Validate JavaScript and regression requirements
        run: npm run check
      - name: Commit source and generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            card-core.js \
            tube-renderer.js \
            card-styles.js \
            glass-tube-display-card.js \
            dist/
          if ! git diff --cached --quiet; then
            git commit -m "Build Glass Tube Display Card v0.3.8"
            git push
          fi
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish v0.3.8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.8 >/dev/null 2>&1; then
            echo "Release v0.3.8 already exists."
          else
            gh release create v0.3.8 \
              --target "${TARGET_SHA}" \
              --title "Glass Tube Display Card v0.3.8" \
              --notes "Replaces the slash-like comma with a larger open-wire comma cathode that has a rounded head and a short descending tail. The comma receives its own slightly wider tube, brighter hot-wire/core layers and fine incandescent bead highlights while remaining stroke-only and physically plausible. Existing panel, degree-sign balance, Lovelace API and automatic HACS resource management remain unchanged."
          fi
      - name: Record successful publication
        run: |
          printf 'Glass Tube Display Card v0.3.8 published successfully.\nSource commit: %s\n' "${TARGET_SHA}" > RELEASED-v0.3.8.txt
          git add RELEASED-v0.3.8.txt
          if ! git diff --cached --quiet; then
            git commit -m "Confirm Glass Tube Display Card v0.3.8 release"
            git push
          fi
