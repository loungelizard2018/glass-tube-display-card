name: Publish release

on:
  push:
    paths:
      - release-trigger-v0.1.3.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build self-contained bundle
        run: node scripts/build.mjs
      - name: Validate bundle
        run: node --check dist/glass-tube-display-card.js
      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/glass-tube-display-card.js
          if ! git diff --cached --quiet; then
            git commit -m "Build self-contained Glass Tube Display Card v0.1.3"
            git push
          fi
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish v0.1.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.3 >/dev/null 2>&1; then
            echo "Release v0.1.3 already exists."
          else
            gh release create v0.1.3 \
              --target "${TARGET_SHA}" \
              --title "Glass Tube Display Card v0.1.3" \
              --notes "Fixes Home Assistant loading by shipping one self-contained JavaScript bundle without runtime module imports."
          fi
      - name: Record successful publication
        run: |
          printf 'Glass Tube Display Card v0.1.3 published successfully.\nSource commit: %s\n' "${TARGET_SHA}" > RELEASED-v0.1.3.txt
          git add RELEASED-v0.1.3.txt
          if ! git diff --cached --quiet; then
            git commit -m "Confirm Glass Tube Display Card v0.1.3 release"
            git push
          fi
