name: Publish release

on:
  push:
    paths:
      - release-trigger-v0.3.6.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install panel build dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Apply v0.3.6 source changes
        run: python scripts/apply_v036_sources.py
      - name: Generate panel and screw assets from Analog Gauge
        run: python scripts/build_panel_asset.py
      - name: Build self-contained HACS bundle
        run: npm run build
      - name: Validate JavaScript and regression requirements
        run: npm run check
      - name: Commit source and generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            card-core.js \
            tube-renderer.js \
            panel-asset.js \
            glass-tube-display-card.js \
            dist/
          if ! git diff --cached --quiet; then
            git commit -m "Build Glass Tube Display Card v0.3.6"
            git push
          fi
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish v0.3.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.6 >/dev/null 2>&1; then
            echo "Release v0.3.6 already exists."
          else
            gh release create v0.3.6 \
              --target "${TARGET_SHA}" \
              --title "Glass Tube Display Card v0.3.6" \
              --notes "Replaces the browser-generated coloured-noise panel with a deterministic monochrome WebP panel derived from the Analog Gauge material reference. The four optional screws are generated from the actual Analog Gauge screw artwork and embedded into the single HACS JavaScript resource. The comma is redrawn as a shorter one-direction wire cathode with substantially reduced bloom, eliminating the question-mark appearance. Existing Lovelace configuration remains compatible."
          fi
      - name: Record successful publication
        run: |
          printf 'Glass Tube Display Card v0.3.6 published successfully.\nSource commit: %s\n' "${TARGET_SHA}" > RELEASED-v0.3.6.txt
          git add RELEASED-v0.3.6.txt
          if ! git diff --cached --quiet; then
            git commit -m "Confirm Glass Tube Display Card v0.3.6 release"
            git push
          fi
