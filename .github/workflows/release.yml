name: Publish release

on:
  push:
    paths:
      - release-trigger-v0.3.2.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build self-contained HACS bundle
        run: npm run build
      - name: Validate all JavaScript files
        run: npm run check
      - name: Commit generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glass-tube-display-card.js dist/
          if ! git diff --cached --quiet; then
            git commit -m "Build corrected Glass Tube Display Card v0.3.2"
            git push
          fi
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish v0.3.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.2 >/dev/null 2>&1; then
            echo "Release v0.3.2 already exists."
          else
            gh release create v0.3.2 \
              --target "${TARGET_SHA}" \
              --title "Glass Tube Display Card v0.3.2" \
              --notes "Removes all circular analog-dial bleed from the panel frame, uses only the thin outer rim plus cropped original Analog Gauge screw regions, widens the punctuation tubes, and replaces the comma dot-and-tail with one continuous curved glowing cathode. Existing Lovelace configuration remains compatible."
          fi
      - name: Record successful publication
        run: |
          printf 'Glass Tube Display Card v0.3.2 published successfully.\nSource commit: %s\n' "${TARGET_SHA}" > RELEASED-v0.3.2.txt
          git add RELEASED-v0.3.2.txt
          if ! git diff --cached --quiet; then
            git commit -m "Confirm Glass Tube Display Card v0.3.2 release"
            git push
          fi
