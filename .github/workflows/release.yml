name: Publish release

on:
  push:
    paths:
      - release-trigger-v0.3.5.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build self-contained HACS bundle
        run: npm run build
      - name: Validate JavaScript and regression requirements
        run: npm run check
      - name: Commit generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glass-tube-display-card.js dist/
          if ! git diff --cached --quiet; then
            git commit -m "Build Glass Tube Display Card v0.3.5"
            git push
          fi
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish v0.3.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.5 >/dev/null 2>&1; then
            echo "Release v0.3.5 already exists."
          else
            gh release create v0.3.5 \
              --target "${TARGET_SHA}" \
              --title "Glass Tube Display Card v0.3.5" \
              --notes "Rebuilds the rectangular enclosure as a self-contained Analog-Gauge-family instrument surface with a pebbled black face, raised outer shell, recessed inner bezel and smaller recessed Phillips screws. Replaces the filled comma with one open wire cathode rendered through restrained shadow, glow, hot-wire and core strokes. Adds automated regression verification while preserving the existing Lovelace API and standard single HACS resource."
          fi
      - name: Record successful publication
        run: |
          printf 'Glass Tube Display Card v0.3.5 published successfully.\nSource commit: %s\n' "${TARGET_SHA}" > RELEASED-v0.3.5.txt
          git add RELEASED-v0.3.5.txt
          if ! git diff --cached --quiet; then
            git commit -m "Confirm Glass Tube Display Card v0.3.5 release"
            git push
          fi
